<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sholat Pintar</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --primary: #27ae60;
            --primary-light: #eafaf1;
            --dark: #2c3e50;
            --gray: #7f8c8d;
            --bg: #f0f4f3;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background: var(--white);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            overflow: hidden;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 1.5px solid #eee;
            border-radius: 15px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .search-box button {
            padding: 0 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .search-box button:active {
            opacity: 0.8;
        }

        /* Countdown Area */
        #countdown-box {
            background: var(--primary);
            color: var(--white);
            padding: 25px 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            box-shadow: 0 10px 20px rgba(39, 174, 96, 0.2);
        }

        #next-prayer-name {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        #timer {
            font-size: 3em;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        /* Info Lokasi */
        .location-info {
            margin-bottom: 20px;
        }

        #city-display {
            margin: 0;
            font-size: 1.5em;
            font-weight: 700;
            color: var(--dark);
        }

        #date-display {
            display: block;
            margin-top: 5px;
            color: var(--gray);
            font-size: 0.9em;
        }

        /* Sound Control */
        .audio-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
        }

        #sound-status {
            font-size: 0.9em;
            font-weight: 600;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .test-sound-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.8em;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 15px;
            display: inline-block;
        }

        /* Prayer Schedule List */
        .schedule-container {
            text-align: left;
        }

        .sholat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            margin-bottom: 10px;
            border-radius: 15px;
            background: #fdfdfd;
            border: 1px solid #f1f1f1;
            transition: all 0.3s ease;
        }

        .sholat-item span:first-child {
            font-weight: 600;
            font-size: 1.05em;
        }

        .sholat-item span:last-child {
            font-weight: 700;
            font-family: monospace;
            font-size: 1.1em;
        }

        .sholat-item.active {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.1);
        }

        .loading-text {
            color: var(--gray);
            font-style: italic;
            padding: 20px;
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
            color: var(--gray);
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        .footer strong {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-height: 700px) {
            .card { padding: 15px; }
            #timer { font-size: 2.5em; }
            .sholat-item { padding: 10px 15px; }
            .footer { margin-top: 15px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="search-box">
        <input type="text" id="input-city" placeholder="Cari kota (mis: Jakarta)...">
        <button onclick="searchCity()">Cari</button>
    </div>

    <div id="countdown-box">
        <div id="next-prayer-name">Mendeteksi...</div>
        <div id="timer">00:00:00</div>
    </div>

    <div class="location-info">
        <h3 id="city-display">Mencari Lokasi...</h3>
        <small id="date-display">-- --- ----</small>
    </div>

    <div class="audio-control">
        <span id="sound-status">🔇 Suara Mati</span>
        <label class="switch">
            <input type="checkbox" id="toggle-sound">
            <span class="slider"></span>
        </label>
    </div>
    
    <button class="test-sound-btn" onclick="testAdhan()">Coba Putar Suara</button>

    <div id="times-list" class="schedule-container">
        <div class="loading-text">Menunggu izin lokasi...</div>
    </div>

    <div class="footer">
        Dibuat dengan ❤️ oleh <strong>Wartam</strong>
    </div>
</div>

<!-- Audio Player dengan Link Google Drive yang diperbarui -->
<audio id="adhan-player" preload="auto" crossorigin="anonymous">
    <!-- Menggunakan format Direct Download dari ID file Google Drive yang Anda berikan -->
    <source src="https://docs.google.com/uc?export=download&id=17E6SPWlpxEjmcaS4qzO4rYsJ3CnVAnKb" type="audio/mpeg">
    <!-- Fallback jika link Drive gagal -->
    <source src="https://www.islamcan.com/common/adhan/adhan1.mp3" type="audio/mpeg">
</audio>

<script>
    let prayerTimes = {};
    let isSoundEnabled = false;
    let lastPlayed = "";
    const namesMap = { 
        'Fajr': 'Subuh', 
        'Dhuhr': 'Dzuhur', 
        'Asr': 'Ashar', 
        'Maghrib': 'Maghrib', 
        'Isha': 'Isya' 
    };

    const soundToggle = document.getElementById('toggle-sound');
    const soundStatus = document.getElementById('sound-status');
    const adhanPlayer = document.getElementById('adhan-player');
    const cityDisplay = document.getElementById('city-display');
    const dateDisplay = document.getElementById('date-display');
    const timerDisplay = document.getElementById('timer');
    const nextNameDisplay = document.getElementById('next-prayer-name');
    const timesList = document.getElementById('times-list');

    // Fungsi Test Suara
    function testAdhan() {
        if(!isSoundEnabled) {
            alert("Harap aktifkan tombol suara di atas terlebih dahulu.");
            return;
        }
        adhanPlayer.currentTime = 0;
        adhanPlayer.play().catch(e => {
            console.error(e);
            alert("Gagal memutar suara. Pastikan file Google Drive diatur ke 'Publik' atau gunakan browser lain.");
        });
    }

    soundToggle.addEventListener('change', function() {
        isSoundEnabled = this.checked;
        soundStatus.innerText = isSoundEnabled ? "🔊 Suara Aktif" : "🔇 Suara Mati";
        
        if (isSoundEnabled) {
            // Melakukan "warm up" audio untuk bypass kebijakan browser
            adhanPlayer.play().then(() => {
                adhanPlayer.pause();
                adhanPlayer.currentTime = 0;
            }).catch(e => {
                console.error("Audio unlock failed:", e);
            });
        } else {
            adhanPlayer.pause();
            adhanPlayer.currentTime = 0;
        }
    });

    function initApp() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => updateByCoords(pos.coords.latitude, pos.coords.longitude), 
                () => {
                    cityDisplay.innerText = "Lokasi tidak diizinkan";
                    // Default Jakarta jika GPS gagal
                    updateByCoords(-6.2088, 106.8456);
                }, 
                { enableHighAccuracy: true, timeout: 10000 }
            );
        } else {
            cityDisplay.innerText = "GPS Tidak Didukung";
            updateByCoords(-6.2088, 106.8456);
        }
    }

    async function updateByCoords(lat, lon) {
        await getCityName(lat, lon);
        await getPrayerData(lat, lon);
        startCountdown();
    }

    async function searchCity() {
        const query = document.getElementById('input-city').value.trim();
        if (!query) return;
        cityDisplay.innerText = "Mencari...";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`);
            const data = await res.json();
            if (data?.length > 0) updateByCoords(data[0].lat, data[0].lon);
            else alert("Kota tidak ditemukan!");
        } catch (e) { alert("Masalah koneksi internet."); }
    }

    async function getCityName(lat, lon) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            const data = await res.json();
            const addr = data.address;
            cityDisplay.innerText = addr.city || addr.town || addr.suburb || "Lokasi Anda";
        } catch (e) { cityDisplay.innerText = "Lokasi Terdeteksi"; }
    }

    async function getPrayerData(lat, lon) {
        try {
            const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=20`);
            const data = await res.json();
            const apiTimings = data.data.timings;
            
            ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(key => {
                prayerTimes[key] = apiTimings[key];
            });

            dateDisplay.innerText = data.data.date.readable;
            renderScheduleList();
        } catch (e) { timesList.innerHTML = "Gagal memuat data jadwal sholat."; }
    }

    function renderScheduleList() {
        timesList.innerHTML = '';
        ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(key => {
            const item = document.createElement('div');
            item.className = 'sholat-item';
            item.id = `item-${key}`;
            item.innerHTML = `<span>${namesMap[key]}</span><span>${prayerTimes[key]}</span>`;
            timesList.appendChild(item);
        });
    }

    function startCountdown() {
        if (window.timerInterval) clearInterval(window.timerInterval);

        window.timerInterval = setInterval(() => {
            const now = new Date();
            const timeNowStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            let next = null;
            let nextKey = '';
            const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

            for (let k of list) {
                if (!prayerTimes[k]) continue;
                const [h, m] = prayerTimes[k].split(':');
                const pDate = new Date();
                pDate.setHours(h, m, 0);
                if (pDate > now) {
                    next = pDate;
                    nextKey = k;
                    break;
                }
            }

            if (!next && prayerTimes['Fajr']) {
                const [h, m] = prayerTimes['Fajr'].split(':');
                next = new Date();
                next.setDate(next.getDate() + 1);
                next.setHours(h, m, 0);
                nextKey = 'Fajr';
            }

            if (next) {
                const diff = next - now;
                const hh = Math.floor(diff / 3600000);
                const mm = Math.floor((diff % 3600000) / 60000);
                const ss = Math.floor((diff % 60000) / 1000);
                timerDisplay.innerText = `${hh.toString().padStart(2, '0')}:${mm.toString().padStart(2, '0')}:${ss.toString().padStart(2, '0')}`;
                nextNameDisplay.innerText = `Menuju ${namesMap[nextKey]}`;
            }
            
            document.querySelectorAll('.sholat-item').forEach(el => el.classList.remove('active'));
            const activeRow = document.getElementById(`item-${nextKey}`);
            if (activeRow) activeRow.classList.add('active');

            // Cek Waktu Sholat Tiba
            list.forEach(k => {
                if (prayerTimes[k] === timeNowStr && lastPlayed !== k) {
                    if (isSoundEnabled) {
                        adhanPlayer.currentTime = 0;
                        adhanPlayer.play().catch(e => console.log("Autoplay ditolak browser:", e));
                        lastPlayed = k;
                    }
                }
            });

            // Reset kunci played jika menit sudah lewat
            if (!list.map(k => prayerTimes[k]).includes(timeNowStr)) {
                lastPlayed = "";
            }

        }, 1000);
    }

    initApp();
</script>

</body>
</html>
