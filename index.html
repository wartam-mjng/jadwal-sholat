<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Sholat Akurat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --bg: #f0f4f3; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .search-box { display: flex; gap: 5px; margin-bottom: 15px; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
        .search-box button { padding: 10px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; }
        #countdown-box { background: var(--primary); color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        #timer { font-size: 2.5em; font-weight: bold; }
        .location-info h3 { margin: 0; color: var(--dark); }
        .location-info small { color: #7f8c8d; }
        .audio-control { display: flex; align-items: center; justify-content: center; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 50px; margin: 15px 0; border: 1px solid #eee; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        input:checked + .slider { background-color: var(--primary); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider:before { transform: translateX(22px); }
        .sholat-item { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #f1f1f1; border-radius: 10px; }
        .sholat-item.active { background: #eafaf1; color: var(--primary); font-weight: bold; transform: scale(1.02); border-bottom: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="search-box">
        <input type="text" id="input-city" placeholder="Ketik nama kota (ex: Majenang)">
        <button onclick="searchCity()">Cari</button>
    </div>

    <div id="countdown-box">
        <div id="next-prayer-name">Mencari Jadwal...</div>
        <div id="timer">00:00:00</div>
    </div>

    <div class="location-info">
        <h3 id="city-display">Mendeteksi Lokasi...</h3>
        <small id="date-display"></small>
    </div>

    <div class="audio-control">
        <span id="sound-status" style="font-size: 0.85em;">🔇 Suara Mati</span>
        <label class="switch">
            <input type="checkbox" id="toggle-sound">
            <span class="slider"></span>
        </label>
    </div>

    <div id="times-list"></div>
</div>

<audio id="adhan-player" src="https://www.islamcan.com/common/adhan/adhan1.mp3"></audio>

<script>
    let prayerTimes = {};
    let isSoundEnabled = false;
    let lastPlayed = "";
    const namesMap = { 'Fajr': 'Subuh', 'Dhuhr': 'Dzuhur', 'Asr': 'Ashar', 'Maghrib': 'Maghrib', 'Isha': 'Isya' };

    // Registrasi PWA
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    // Toggle Suara
    document.getElementById('toggle-sound').addEventListener('change', function() {
        isSoundEnabled = this.checked;
        document.getElementById('sound-status').innerText = isSoundEnabled ? "🔊 Suara Aktif" : "🔇 Suara Mati";
        if(isSoundEnabled) { 
            const p = document.getElementById('adhan-player');
            p.play().then(() => { p.pause(); p.currentTime = 0; }).catch(() => {});
        }
    });

    function initApp() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                updateByCoords(pos.coords.latitude, pos.coords.longitude);
            }, () => {
                document.getElementById('city-display').innerText = "Gunakan Pencarian Manual";
            }, { enableHighAccuracy: true });
        }
    }

    async function updateByCoords(lat, lon) {
        await getCityName(lat, lon);
        await getPrayerData(lat, lon);
        startCountdown();
    }

    async function searchCity() {
        const query = document.getElementById('input-city').value;
        if(!query) return;
        document.getElementById('city-display').innerText = "Mencari...";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`);
            const data = await res.json();
            if(data.length > 0) {
                updateByCoords(data[0].lat, data[0].lon);
            } else { alert("Kota tidak ditemukan"); }
        } catch (e) { alert("Error mencari kota"); }
    }

    async function getCityName(lat, lon) {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const data = await res.json();
        const addr = data.address;
        document.getElementById('city-display').innerText = addr.town || addr.city || addr.suburb || addr.village || "Lokasi Anda";
    }

    async function getPrayerData(lat, lon) {
        // Menggunakan method 20 (Kemenag RI) dan tune parameter untuk akurasi ekstra
        const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=20&school=1`);
        const data = await res.json();
        const rawTimes = data.data.timings;
        
        // Koreksi manual Ihtiyati (+2 menit) agar sama dengan Google/Masjid
        const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
        list.forEach(key => {
            let [h, m] = rawTimes[key].split(':').map(Number);
            let date = new Date();
            date.setHours(h, m + 2); // Menambah 2 menit pengaman
            prayerTimes[key] = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        });

        document.getElementById('date-display').innerText = data.data.date.readable;
        renderList();
    }

    function renderList() {
        const container = document.getElementById('times-list');
        container.innerHTML = '';
        ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'].forEach(key => {
            container.innerHTML += `<div class="sholat-item" id="item-${key}"><span>${namesMap[key]}</span><span>${prayerTimes[key]}</span></div>`;
        });
    }

    function startCountdown() {
        if(window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            let next = null; let nextKey = '';
            const list = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

            for (let k of list) {
                const [h, m] = prayerTimes[k].split(':');
                const p = new Date(); p.setHours(h, m, 0);
                if (p > now) { next = p; nextKey = k; break; }
            }
            if(!next) {
                const [h, m] = prayerTimes['Fajr'].split(':');
                next = new Date(); next.setDate(next.getDate()+1); next.setHours(h, m, 0); nextKey = 'Fajr';
            }

            const diff = next - now;
            const hh = Math.floor(diff/3600000); const mm = Math.floor((diff%3600000)/60000); const ss = Math.floor((diff%60000)/1000);
            document.getElementById('timer').innerText = `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;
            document.getElementById('next-prayer-name').innerText = `Menuju ${namesMap[nextKey]}`;
            
            document.querySelectorAll('.sholat-item').forEach(e => e.classList.remove('active'));
            const activeEl = document.getElementById(`item-${nextKey}`);
            if(activeEl) activeEl.classList.add('active');

            if(prayerTimes[nextKey] === timeStr && lastPlayed !== nextKey && isSoundEnabled) {
                document.getElementById('adhan-player').play();
                lastPlayed = nextKey;
            }
        }, 1000);
    }

    initApp();
</script>
</body>
</html>
